<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Intelligence Systems</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-xl p-6 shadow-xl border border-slate-700">
    <h1 class="text-2xl font-bold text-emerald-400 mb-2">Future Intelligence Systems</h1>
    <p class="text-slate-400 text-sm mb-6">Automated AI solutions for your business growth.</p>
    
    <form id="leadForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300">Name</label>
        <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-400">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300">Email</label>
        <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-400">
      </div>
      <div>
        <label class="block text-xs font-semibold mb-1 text-slate-300">Inquiry</label>
        <textarea id="message" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-400"></textarea>
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg text-sm transition">Submit Request</button>
    </form>
    <div id="statusMsg" class="hidden mt-4 p-3 rounded-lg text-xs font-medium text-center"></div>
  </div>

  <script>
    const form = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerText = 'Sending...';
      
      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('YOUR_N8N_WEBHOOK_URL_HERE', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMsg.className = 'mt-4 p-3 rounded-lg text-xs font-medium text-center bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
          statusMsg.innerText = '✓ Request submitted successfully!';
          form.reset();
        } else {
          throw new Error();
        }
      } catch (err) {
        statusMsg.className = 'mt-4 p-3 rounded-lg text-xs font-medium text-center bg-rose-500/10 text-rose-400 border border-rose-500/30';
        statusMsg.innerText = '✕ Submission failed. Please check setup.';
      } finally {
        statusMsg.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Request';
      }
    });
  </script>
</body>
</html>
